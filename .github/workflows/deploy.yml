name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate migration script
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations script --idempotent \
            --project src/P2P.Infrastructure \
            --startup-project src/P2P.Web \
            --output ${{ runner.temp }}/migrate.sql

      - name: Apply migrations
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.P2P_SQL_CONNECTION }}
          path: ${{ runner.temp }}/migrate.sql

      - name: Deploy application
        run: |
          dotnet publish src/P2P.Web -c Release -o ./publish
          # …push to your host…
